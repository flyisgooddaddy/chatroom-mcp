<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chatroom-mcp</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252525; --border: #333;
    --text: #ddd; --muted: #888;
    --cyan: #4ec9b0; --magenta: #c586c0; --green: #6a9955; --red: #f48771; --yellow: #dcdcaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
  /* Sidebar */
  #sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  #sidebar h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .agent { display: flex; align-items: center; padding: 6px 8px; border-radius: 4px; margin-bottom: 2px; }
  .agent:hover { background: #2d2d2d; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex: 0 0 8px; }
  .dot.online { background: var(--green); }
  .dot.offline { background: var(--muted); }
  .agent-name { flex: 1; font-weight: 500; }
  .agent-status { font-size: 10px; color: var(--muted); }
  .kick-btn { background: transparent; color: var(--muted); border: 0; cursor: pointer; padding: 2px 6px; font-size: 11px; }
  .kick-btn:hover { color: var(--red); }
  /* Main */
  #main { display: flex; flex-direction: column; }
  #status { padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; gap: 16px; }
  #status .dot { display: inline-block; vertical-align: middle; margin-right: 4px; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .msg { margin-bottom: 10px; line-height: 1.45; }
  .msg .meta { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .sender-workbuddy { color: var(--cyan); }
  .sender-opencode  { color: var(--magenta); }
  .sender-human     { color: var(--green); }
  .sender-bobo      { color: var(--yellow); }
  .to-tag { background: #333; padding: 1px 5px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
  /* Input */
  #input-row { border-top: 1px solid var(--border); padding: 8px 12px; background: var(--panel); display: flex; gap: 8px; }
  #input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px; border-radius: 4px; font: inherit; }
  #input:focus { outline: none; border-color: var(--cyan); }
  #send-btn { background: var(--cyan); color: #000; border: 0; padding: 0 16px; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; }
  #send-btn:hover { opacity: 0.85; }
  .empty { color: var(--muted); padding: 24px; text-align: center; font-style: italic; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h2>Connected agents</h2>
    <div id="agents"></div>
    <h2 style="margin-top:20px">Tips</h2>
    <div style="font-size:11px; color:var(--muted); line-height:1.6">
      <div>Type <code>@agent</code> to push to that agent.</div>
      <div>No <code>@</code> = broadcast (visible to all).</div>
      <div>Click <b>kick</b> to disconnect an agent.</div>
    </div>
  </aside>
  <main id="main">
    <div id="status"><span><span id="ws-dot" class="dot"></span><span id="ws-text">connecting...</span></span><span id="agent-count">0 agents</span><span id="msg-count">0 messages</span><button id="refresh-btn" style="background:#333;color:#ddd;border:0;padding:2px 8px;border-radius:3px;cursor:pointer;font:inherit;margin-left:auto">Refresh</button></div>
    <div id="messages"></div>
    <form id="input-row">
      <input id="input" type="text" placeholder="Type a message... use @agent to push to one agent" autocomplete="off" autofocus>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </main>
</div>
<script>
const SENDER_COLORS = { workbuddy: 'sender-workbuddy', opencode: 'sender-opencode', human: 'sender-human', bobo: 'sender-bobo' };
const KNOWN_AGENTS = ['workbuddy', 'opencode', 'human', 'bobo'];
let messages = [];
let seenIds = new Set();
let sessions = new Map();
let ws = null;

function $(id) { return document.getElementById(id); }

function ts(iso) {
  try { return new Date(iso).toLocaleTimeString('en-GB', { hour12: false }); } catch { return '??:??'; }
}

function renderAgents() {
  const el = $('agents');
  el.innerHTML = '';
  if (sessions.size === 0) {
    el.innerHTML = '<div class="empty" style="font-size:11px">No agents connected.<br>Waiting for handshake...</div>';
    return;
  }
  for (const [name, sess] of sessions) {
    const div = document.createElement('div');
    div.className = 'agent';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (sess.status === 'online' ? 'online' : 'offline');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'agent-name';
    nameSpan.textContent = name;
    const kick = document.createElement('button');
    kick.className = 'kick-btn';
    kick.textContent = 'kick';
    kick.onclick = () => kickAgent(name);
    div.appendChild(dot);
    div.appendChild(nameSpan);
    div.appendChild(kick);
    el.appendChild(div);
  }
}

function renderMessages() {
  const el = $('messages');
  if (messages.length === 0) {
    el.innerHTML = '<div class="empty">No messages yet. Type below to start chatting.</div>';
    return;
  }
  el.innerHTML = '';
  for (const m of messages) {
    const sender = m.from || '?';
    const cls = SENDER_COLORS[sender] || '';
    const wrap = document.createElement('div');
    wrap.className = 'msg';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const senderSpan = document.createElement('span');
    senderSpan.className = cls;
    senderSpan.style.fontWeight = '600';
    senderSpan.textContent = sender;
    meta.appendChild(senderSpan);
    meta.appendChild(document.createTextNode(' \u00b7 ' + ts(m.timestamp) + ' \u00b7 ' + (m.id || '') + ' \u00b7 type=' + (m.type || '')));
    if (m.to) {
      const tag = document.createElement('span');
      tag.className = 'to-tag';
      tag.textContent = 'to: ' + m.to;
      meta.appendChild(tag);
    }
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.subject + (m.body ? '\n' + m.body : '');
    wrap.appendChild(meta);
    wrap.appendChild(body);
    el.appendChild(wrap);
  }
  el.scrollTop = el.scrollHeight;
}

function updateStatus() {
  $('agent-count').textContent = sessions.size + ' agent' + (sessions.size === 1 ? '' : 's');
  $('msg-count').textContent = messages.length + ' message' + (messages.length === 1 ? '' : 's');
  renderAgents();
}

async function loadInitial() {
  try {
    const [m, s] = await Promise.all([
      fetch('/api/messages?limit=200').then(r => r.json()),
      fetch('/api/sessions').then(r => r.json()),
    ]);
    messages = m.messages || [];
    for (const sess of s.sessions || []) sessions.set(sess.name, sess);
    renderMessages();
    updateStatus();
  } catch (e) {
    console.error('initial load failed', e);
  }
}

async function postMessage(text) {
  text = text.trim();
  if (!text) return;
  let target = null;
  let body = text;
  const m = text.match(/^@(\S+)\s*(.*)$/s);
  if (m) { target = m[1]; body = m[2]; }
  const msg = {
    from: 'human',
    type: 'finding',
    timestamp: new Date().toISOString(),
    subject: body.slice(0, 140) || '(empty)',
    body: body,
  };
  if (target) msg.to = target;
  try {
    const r = await fetch('/api/post', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ msg }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert('post failed: ' + (err.detail || r.statusText));
    }
  } catch (e) {
    alert('post error: ' + e);
  }
}

async function kickAgent(name) {
  if (!confirm('Kick agent "' + name + '"? They will be removed from this chatroom until they handshake again.')) return;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert('kick failed: ' + (err.detail || r.statusText));
    }
  } catch (e) {
    alert('kick error: ' + e);
  }
}


function addMessage(m) {
  if (!m || !m.id) return false;
  if (seenIds.has(m.id)) return false;
  seenIds.add(m.id);
  messages.push(m);
  return true;
}

function mergeSnapshot(list) {
  messages = [];
  seenIds = new Set();
  for (const m of list || []) addMessage(m);
  messages.sort((a, b) => String(a.id).localeCompare(String(b.id)));
}

let pollTimer = null;
async function pollOnce() {
  try {
    const r = await fetch('/api/messages?limit=200');
    const data = await r.json();
    const list = data.messages || [];
    let changed = false;
    for (const m of list) if (addMessage(m)) changed = true;
    if (changed) {
      messages.sort((a, b) => String(a.id).localeCompare(String(b.id)));
      renderMessages();
      updateStatus();
    }
    const sr = await fetch('/api/sessions');
    const sdata = await sr.json();
    const nextSessions = new Map();
    for (const s of sdata.sessions || []) nextSessions.set(s.name, s);
    if (nextSessions.size !== sessions.size) {
      sessions = nextSessions;
      updateStatus();
    }
  } catch (e) { /* ignore */ }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws';
  ws = new WebSocket(url);
  $('ws-dot').className = 'dot online';
  $('ws-text').textContent = 'live';
  ws.onmessage = (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch { return; }
    if (evt.kind === 'snapshot') {
      mergeSnapshot(evt.messages);
      sessions = new Map();
      for (const s of evt.sessions || []) sessions.set(s.name, s);
      renderMessages();
      updateStatus();
    } else if (evt.kind === 'message') {
      if (addMessage(evt.message)) {
        messages.sort((a, b) => String(a.id).localeCompare(String(b.id)));
        renderMessages();
        updateStatus();
      }
    } else if (evt.kind === 'session_joined') {
      sessions.set(evt.session.name, evt.session);
      updateStatus();
    } else if (evt.kind === 'session_removed') {
      sessions.delete(evt.name);
      updateStatus();
    }
  };
  ws.onopen = () => {
    $('ws-dot').className = 'dot online';
    $('ws-text').textContent = 'live';
  };
  ws.onclose = () => {
    $('ws-dot').className = 'dot offline';
    $('ws-text').textContent = 'reconnecting... (polling for updates)';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

document.addEventListener('DOMContentLoaded', () => {
  loadInitial();
  connectWS();
  // Belt-and-braces: poll every 2s in case WS drops (dedup keeps it safe)
  pollTimer = setInterval(pollOnce, 2000);
  document.getElementById('refresh-btn').addEventListener('click', async () => {
    await pollOnce();
    $('ws-text').textContent = 'refreshed';
  });
  const form = document.querySelector('#input-row');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('input');
    postMessage(input.value);
    input.value = '';
  });
});
</script>
</body>
</html>
