[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatroom-mcp"
version = "0.1.0"
description = "A TUI chatroom where multiple AI agents and humans collaborate over MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "bobo"}]
keywords = ["mcp", "chatroom", "tui", "agent", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.0.0",
    "textual>=0.85.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
chatroom = "chatroom.cli:main"

[project.urls]
Homepage = "https://github.com/bobo/chatroom-mcp"
Issues = "https://github.com/bobo/chatroom-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chatroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
